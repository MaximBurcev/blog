services:
    laravel.test:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
            - '${REVERB_PORT:-8080}:${REVERB_PORT:-8080}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            PHP_MAX_EXECUTION_TIME: 300
        volumes:
            - '.:/var/www/html'
            - ~/.ssh:/home/sail/.ssh:ro
        networks:
            - sail
        depends_on:
            - mysql
            - mailpit
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            # Только с localhost хост-машины — раньше 3306 торчал наружу на
            # всех интерфейсах вместе с root без пароля (см. ниже).
            - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            # root теперь логинится только изнутри контейнера — приложение
            # ходит под DB_USERNAME (grant на '%' создаёт сам образ), root
            # снаружи ему не нужен.
            MYSQL_ROOT_HOST: 'localhost'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
    mailpit:
        image: 'axllent/mailpit:latest'
        # Только с localhost, как и mysql выше. Веб-морда Mailpit не требует
        # аутентификации, а это ВСЕ исходящие письма — включая живые ссылки
        # сброса пароля и подтверждения почты. На 0.0.0.0 их читал любой
        # в той же сети.
        ports:
            - '127.0.0.1:${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    meilisearch:
        image: getmeili/meilisearch:latest
        container_name: meilisearch
        restart: unless-stopped
        # Тоже только localhost: при пустом MEILISEARCH_KEY (а его нет в
        # .env.example) Meilisearch стартует вообще без авторизации, и индекс
        # читается и перезаписывается снаружи.
        ports:
            - 127.0.0.1:7720:7700
        environment:
            MEILI_NO_ANALYTICS: ${MEILISEARCH_NO_ANALYTICS}
            MEILI_NO_SENTRY: ${MEILISEARCH_NO_SENTRY}
            MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
        networks:
            - sail
        volumes:
            # Образ хранит индекс в /meili_data (WORKDIR), не /meilisearch-data —
            # старый путь монтировал пустой каталог, а реальные данные жили
            # только внутри контейнера и терялись при пересоздании.
            - ./meilisearch-data:/meili_data
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
